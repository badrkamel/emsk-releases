name: Report a bug
description: Help improve EMSK by describing a problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Reports are public. Do not include passwords, access tokens or personal information.'
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: ['Windows 10', 'Windows 11', 'Linux']
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and steps to reproduce the problem.
    validations:
      required: true
